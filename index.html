<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172554">
<title>Daily Expense & Profit Tracker</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#e2e8f0;--blue:#1d4ed8;--blue2:#dbeafe;--green:#15803d;--red:#b91c1c;--amber:#b45309;--shadow:0 8px 24px #0f172a0c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:9px 13px;background:var(--blue);color:white;font-weight:650}button.secondary{background:#eef2ff;color:#1e3a8a}button.danger{background:#fee2e2;color:#991b1b}button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}button.small{padding:6px 9px;font-size:12px}.top{background:#172554;color:white;padding:15px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5;box-shadow:0 3px 14px #0f172a22}.brand{font-size:18px;font-weight:800}.brand small{display:block;font-size:11px;font-weight:500;color:#bfdbfe}.top input{background:#fff;color:#172033;border:0;border-radius:8px;padding:8px}.layout{max-width:1400px;margin:auto;display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 64px)}aside{padding:18px 12px;border-right:1px solid var(--line);background:#fff}nav{display:grid;gap:5px}nav button{background:transparent;color:#475569;text-align:left;font-weight:600}nav button.active,nav button:hover{background:#eaf1ff;color:#1e40af}.content{padding:22px;min-width:0}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.pagehead h1{font-size:23px;margin:0}.sub{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}.metric,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}.metric .label{color:var(--muted);font-size:12px;font-weight:650}.metric .value{font-size:24px;font-weight:800;margin-top:6px;letter-spacing:-.5px}.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{margin-bottom:14px}.panel h2{font-size:16px;margin:0 0 12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#475569}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:9px;background:white;color:var(--ink);min-width:0}.field textarea{min-height:64px;resize:vertical}.actions{display:flex;gap:7px;flex-wrap:wrap}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:10px 9px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#f8fafc;position:sticky;top:0}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}.pill{display:inline-block;padding:3px 8px;border-radius:30px;background:#f1f5f9;color:#475569;font-size:11px;font-weight:700}.pill.good{background:#dcfce7;color:#166534}.pill.warn{background:#fef3c7;color:#92400e}.pill.bad{background:#fee2e2;color:#991b1b}.muted{color:var(--muted)}.empty{text-align:center;padding:28px;color:var(--muted)}.notice{padding:11px 13px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;color:#1e40af;margin-bottom:14px}.notice.warn{background:#fffbeb;border-color:#fde68a;color:#92400e}.hidden{display:none!important}.modalback{position:fixed;inset:0;background:#0f172a80;display:grid;place-items:center;padding:16px;z-index:20}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:white;border-radius:16px;padding:20px;box-shadow:0 25px 70px #0004}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modalhead h2{margin:0}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0f172a;color:white;padding:10px 15px;border-radius:9px;z-index:30;box-shadow:var(--shadow)}.footer{padding:15px;text-align:center;color:var(--muted);font-size:11px}.mobilebar{display:none}.balance-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line)}.right{text-align:right}.sectiontitle{font-weight:800;margin:18px 0 9px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:1fr}aside{display:none}.content{padding:14px}.mobilebar{display:flex;overflow:auto;gap:5px;padding:8px;background:white;border-bottom:1px solid var(--line);position:sticky;top:61px;z-index:4}.mobilebar button{white-space:nowrap;padding:7px 10px;font-size:12px}.cols{grid-template-columns:1fr}}
@media(max-width:560px){.top{padding:11px 12px}.brand{font-size:15px}.brand small{display:none}.top input{max-width:140px;font-size:12px}.grid{gap:8px}.metric{padding:12px}.metric .value{font-size:19px}.content{padding:11px}.pagehead h1{font-size:20px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.panel{padding:12px}}
@media print{.top,aside,.mobilebar,.no-print,button{display:none!important}.layout{display:block}.content{padding:0}.panel,.metric{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<header class="top"><div class="brand">Daily Expense & Profit Tracker<small>Offline-first • Your data stays in this browser</small></div><div class="toolbar"><label class="sub" style="color:#dbeafe">Working date</label><input id="workDate" type="date"></div></header>
<div class="mobilebar" id="mobileNav"></div>
<div class="layout"><aside><nav id="sideNav"></nav><div class="panel" style="margin-top:18px;box-shadow:none"><div class="sub">Storage status</div><strong style="color:#15803d">● Saved locally</strong><p class="sub">No login or internet required.</p></div></aside>
<main class="content" id="app"></main></div>
<div id="modalHost"></div><div id="toastHost"></div>
<script>
(()=>{
'use strict';
const KEY='expenseTrackerLedgerDb_v1', NEWKEY='expenseTrackerStandalone_v2', THEME='expenseTrackerTheme';
const $=s=>document.querySelector(s), money=n=>'₹'+(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2}), today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}, id=p=>p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state,view='dashboard',editing=null,modal=null;
const empty=()=>({version:2,openingBank:0,allocatedBudget:0,bookings:[],customerPayments:[],ticketPayments:[],expenses:[],loans:[],loanRepayments:[],legacyReceivables:[],notes:[]});
function migrateOld(old){
 const d=empty(); if(!old||typeof old!=='object')return d;d.allocatedBudget=Number(old.allocatedBudget)||0;
 const banks=Array.isArray(old.banks)?old.banks:[];d.openingBank=banks.reduce((s,b)=>s+(Number(b.initialBalance)||0),0);
 (old.tickets||[]).forEach(t=>{
  d.bookings.push({id:String(t.id||id('bk')),date:t.date||today(),customerName:t.customerName||'',journey:t.journey||'',ticketCost:+t.ticketCost||0,serviceCharge:+t.serviceCharge||0,bookingRef:t.bookingRef||'',notes:t.notes||'',legacy:true});
  if((+t.customerPaid||0)>0){if(t.receivedIn==='udhar'){if(!(old.udhar||[]).some(u=>String(u.linkedTicketId||'')===String(t.id)))d.legacyReceivables.push({id:id('lr'),bookingId:String(t.id),date:t.date||today(),personName:t.customerName||'',amount:+t.customerPaid||0,status:'pending',note:'Imported as pending customer receivable; not counted as bank money.'});}else d.customerPayments.push({id:id('cp'),bookingId:String(t.id),date:t.date||today(),customerName:t.customerName||'',amount:+t.customerPaid||0,account:t.receivedIn==='cash'?'cash':'bank',note:'Imported customer payment'});}
  if((+t.ticketCost||0)>0)d.ticketPayments.push({id:id('tp'),bookingId:String(t.id),date:t.date||today(),amount:+t.ticketCost||0,account:(t.paidFromAccountId==='cash'?'cash':'bank'),note:'Imported ticket cost payment'});
 });
 (old.expenses||[]).forEach(e=>d.expenses.push({id:String(e.id||id('ex')),date:e.date||today(),amount:+e.amount||0,category:e.category||'Other',description:e.paidTo||'',account:e.paidFromAccountId==='cash'?'cash':'bank'}));
 (old.udhar||[]).forEach(u=>{d.legacyReceivables.push({id:String(u.id||id('lr')),bookingId:u.linkedTicketId||'',date:u.date||today(),personName:u.personName||'',amount:+u.amount||0,status:u.status||'pending',note:'Imported legacy Udhar receivable; retained separately because its original meaning was customer dues.'});if(u.status==='settled')d.customerPayments.push({id:id('cp'),bookingId:u.linkedTicketId||'',date:u.settledDate||u.date||today(),customerName:u.personName||'',amount:+u.amount||0,account:u.settledAccountId==='cash'?'cash':'bank',note:'Imported settlement of legacy customer receivable'});});
 (old.cashAdditions||[]).forEach(c=>d.notes.push({id:String(c.id||id('ca')),date:c.date||today(),amount:+c.amount||0,note:'Imported cash addition: '+(c.note||'')}));
 d._migration={from:KEY,at:new Date().toISOString(),original:old};return d;
}
function load(){try{let n=localStorage.getItem(NEWKEY);if(n)return normalize(JSON.parse(n));let old=localStorage.getItem(KEY);if(old){let m=migrateOld(JSON.parse(old));save(m);return m;}}catch(e){console.error(e);alert('Could not read saved data. The app will start empty; your original browser data has not been deleted.')}return empty()}
function normalize(x){const d=empty();if(!x||typeof x!=='object')return d;for(const k of Object.keys(d))if(Array.isArray(d[k]))d[k]=Array.isArray(x[k])?x[k]:[];d.openingBank=Number(x.openingBank)||0;d.allocatedBudget=Number(x.allocatedBudget)||0;d._migration=x._migration;return d}
function save(s=state){localStorage.setItem(NEWKEY,JSON.stringify(s));}
function sum(a,fn=x=>x){return a.reduce((s,x)=>s+(Number(fn(x))||0),0)}
function month(d){return String(d||'').slice(0,7)}
function bankBalance(){return state.openingBank+sum(state.customerPayments,p=>p.account==='bank'?p.amount:0)+sum(state.loanRepayments,p=>p.account==='bank'?p.amount:0)-sum(state.ticketPayments,p=>p.account==='bank'?p.amount:0)-sum(state.expenses,p=>p.account==='bank'?p.amount:0)-sum(state.loans,l=>l.account==='bank'?l.amount:0)}
function cashBalance(){return sum(state.customerPayments,p=>p.account==='cash'?p.amount:0)+sum(state.loanRepayments,p=>p.account==='cash'?p.amount:0)-sum(state.ticketPayments,p=>p.account==='cash'?p.amount:0)-sum(state.expenses,p=>p.account==='cash'?p.amount:0)-sum(state.loans,l=>l.account==='cash'?l.amount:0)+sum(state.notes,n=>n.amount)}
function profit(m=today().slice(0,7)){return sum(state.bookings.filter(b=>month(b.date)===m),b=>b.serviceCharge)-sum(state.expenses.filter(e=>month(e.date)===m),e=>e.amount)}
function custPaid(bid){return sum(state.customerPayments.filter(p=>p.bookingId===bid),p=>p.amount)}
function ticketPaid(bid){return sum(state.ticketPayments.filter(p=>p.bookingId===bid),p=>p.amount)}
function due(b){return Math.max(0,b.ticketCost+b.serviceCharge-custPaid(b))}
function ticketDue(b){return Math.max(0,b.ticketCost-ticketPaid(b))}
function loanPaid(lid){return sum(state.loanRepayments.filter(p=>p.loanId===lid),p=>p.amount)}
function loanDue(l){return Math.max(0,l.amount-loanPaid(l.id))}
function toast(s){$('#toastHost').innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>$('#toastHost').innerHTML='',2600)}
const nav=[['dashboard','Dashboard'],['bookings','Ticket Bookings'],['expenses','Other Expenses'],['udhar','Udhar / Lending'],['bank','Bank & Transactions'],['reports','Monthly Reports'],['records','All Records'],['customers','Customer Profiles'],['budget','Budget Calculator'],['backup','Backup & Settings']];
function navHtml(){const h=nav.map(([k,n])=>`<button data-view="${k}" class="${view===k?'active':''}">${n}</button>`).join('');$('#sideNav').innerHTML=h;$('#mobileNav').innerHTML=h}
function pageHead(title,sub='',actions=''){return `<div class="pagehead"><div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="toolbar no-print">${actions}</div></div>`}
function metric(label,value,cls='',foot=''){return `<div class="metric"><div class="label">${label}</div><div class="value ${cls}">${value}</div>${foot?`<div class="sub">${foot}</div>`:''}</div>`}
function panel(title,body,extra=''){return `<section class="panel"><div class="toolbar" style="justify-content:space-between"><h2>${title}</h2>${extra}</div>${body}</section>`}
function field(label,name,type='text',value='',opts='',full=false,placeholder=''){const req=(type==='date'&&name==='date')||['number','select'].includes(type)||['customerName','personName'].includes(name);let input=type==='select'?`<select name="${name}" ${req?'required':''}>${opts}</select>`:type==='textarea'?`<textarea name="${name}" placeholder="${esc(placeholder)}">${esc(value)}</textarea>`:`<input name="${name}" type="${type}" value="${esc(value)}" ${type==='number'?'min="0" step="0.01"':''} placeholder="${esc(placeholder)}" ${req?'required':''}>`;return `<div class="field ${full?'full':''}"><label>${label}</label>${input}</div>`}
function accountOpts(selected='bank'){return `<option value="bank" ${selected==='bank'?'selected':''}>Bank</option><option value="cash" ${selected==='cash'?'selected':''}>Cash</option>`}
function table(headers,rows,emptyText='No records yet'){return rows.length?`<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th class="${h.right?'num':''}">${h.label}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:`<div class="empty">${emptyText}</div>`}
function rowActions(type,idv){return `<div class="actions"><button class="small secondary" data-edit="${type}" data-id="${esc(idv)}">Edit</button><button class="small danger" data-delete="${type}" data-id="${esc(idv)}">Delete</button></div>`}
function renderDashboard(){
 const m=$('#workDate').value.slice(0,7),monthBookings=state.bookings.filter(b=>month(b.date)===m),monthExpenses=state.expenses.filter(e=>month(e.date)===m),openLoans=state.loans.reduce((s,l)=>s+loanDue(l),0),outstanding=state.legacyReceivables.filter(r=>r.status!=='settled').reduce((s,r)=>s+r.amount,0);
 const tx=transactions().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);
 return pageHead('Dashboard','Your daily money position and monthly performance')+
 `<div class="grid">${metric('Current Bank Balance',money(bankBalance()),bankBalance()<0?'red':'green','Opening balance + actual bank receipts − bank payments')}${metric('Monthly Net Profit',money(profit(m)),profit(m)<0?'red':'green','Service charges − other expenses')}${metric('Other Expenses',money(sum(monthExpenses,e=>e.amount)),'red','This month')}${metric('Udhar Outstanding',money(openLoans+outstanding),'amber','Loans given + imported customer dues')}</div>
 <div class="grid">${metric('Ticket Bookings',monthBookings.length,'',`For ${m}`)}${metric('Booking Service Charges',money(sum(monthBookings,b=>b.serviceCharge)),'green','Profit before other expenses')}${metric('Customer Amount Due',money(sum(state.bookings,due)),'amber','Uncollected booking amount')}${metric('Cash on Hand',money(cashBalance()),'','Separate from bank balance')}</div>
 <div class="cols">${panel('Recent Money Movements',table([{label:'Date'},{label:'Details'},{label:'Type'},{label:'Amount',right:true}],tx.map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(t.title)}</td><td><span class="pill ${t.in?'good':'bad'}">${t.in?'Money In':'Money Out'}</span></td><td class="num ${t.in?'green':'red'}">${t.in?'+':'−'}${money(t.amount)}</td></tr>`),'No transactions recorded yet'))}
 ${panel('Quick Actions',`<div class="toolbar"><button data-action="new-booking">+ New Ticket Booking</button><button class="secondary" data-action="new-expense">+ Other Expense</button><button class="secondary" data-action="new-loan">+ Give Udhar</button><button class="secondary" data-view="bank">View Bank Statement</button></div><p class="sub" style="margin-top:14px">Ticket cost, Udhar lent and Udhar repayments affect cash/bank balances but are not counted as profit or ordinary expenses.</p>`)}</div>
 ${state._migration?`<div class="notice warn"><b>Existing data migrated.</b> Your original ledger snapshot is retained inside the new backup. Imported older customer dues are kept separately as legacy receivables because their meaning differs from money you lend out. Review the Backup & Settings page and export a backup.</div>`:''}`;
}
function renderBookings(){
 const list=[...state.bookings].sort((a,b)=>b.date.localeCompare(a.date));
 const rows=list.map(b=>`<tr><td>${esc(b.date)}</td><td><b>${esc(b.customerName)}</b><div class="sub">${esc(b.journey||'')}${b.bookingRef?' • Ref '+esc(b.bookingRef):''}</div></td><td class="num">${money(b.ticketCost)}</td><td class="num green">${money(b.serviceCharge)}</td><td class="num">${money(custPaid(b.id))}<div class="sub">Due ${money(due(b))}</div></td><td class="num">${money(ticketPaid(b.id))}<div class="sub">Due ${money(ticketDue(b))}</div></td><td><div class="actions"><button class="small secondary" data-action="customer-payment" data-id="${esc(b.id)}">Receive</button><button class="small secondary" data-action="ticket-payment" data-id="${esc(b.id)}">Pay Ticket</button>${rowActions('booking',b.id)}</div></td></tr>`);
 return pageHead('Ticket Bookings','Booking details are separate from actual customer and ticket payments.','<button data-action="new-booking">+ Add Booking</button>')+
 panel('Booking Register',table([{label:'Date'},{label:'Customer / Journey'},{label:'Ticket Cost',right:true},{label:'Service Charge',right:true},{label:'Customer Paid',right:true},{label:'Ticket Paid',right:true},{label:'Actions'}],rows,'No ticket bookings yet. Add your first booking.'));
}
function renderExpenses(){
 const rows=[...state.expenses].sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.description)}</td><td>${esc(e.category)}</td><td>${e.account==='bank'?'Bank':'Cash'}</td><td class="num red">${money(e.amount)}</td><td>${rowActions('expense',e.id)}</td></tr>`);
 return pageHead('Other Expenses','Only ordinary business expenses reduce monthly net profit.','<button data-action="new-expense">+ Add Expense</button>')+panel('Expense Register',table([{label:'Date'},{label:'Description'},{label:'Category'},{label:'Paid From'},{label:'Amount',right:true},{label:'Actions'}],rows));
}
function renderUdhar(){
 const rows=[...state.loans].sort((a,b)=>b.date.localeCompare(a.date)).map(l=>`<tr><td>${esc(l.date)}</td><td><b>${esc(l.personName)}</b><div class="sub">${esc(l.note||'')}</div></td><td class="num">${money(l.amount)}</td><td class="num green">${money(loanPaid(l.id))}</td><td class="num amber">${money(loanDue(l))}</td><td>${l.account==='bank'?'Bank':'Cash'}</td><td><div class="actions"><button class="small secondary" data-action="loan-repay" data-id="${esc(l.id)}">Record Repayment</button>${rowActions('loan',l.id)}</div></td></tr>`);
 const legacy=state.legacyReceivables.filter(r=>r.status!=='settled').map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.personName)}</td><td class="num">${money(r.amount)}</td><td><span class="pill warn">Legacy customer due</span></td></tr>`);
 return pageHead('Udhar / Lending','Record money you lend out and repayments separately.','<button data-action="new-loan">+ Give Udhar</button>')+panel('Money Lent',table([{label:'Date'},{label:'Person / Note'},{label:'Lent',right:true},{label:'Repaid',right:true},{label:'Outstanding',right:true},{label:'From'},{label:'Actions'}],rows))+
 (legacy.length?panel('Imported Customer Receivables (Legacy)',`<div class="notice warn">These entries came from the old app's pending customer payments. They are kept separate and are not treated as money lent by you.</div>`+table([{label:'Date'},{label:'Customer'},{label:'Amount',right:true},{label:'Type'}],legacy)):'');
}
function transactions(){
 const a=[];state.customerPayments.forEach(p=>a.push({id:p.id,date:p.date,title:`Customer payment — ${p.customerName}`,type:'customer',amount:p.amount,account:p.account,in:true}));state.loanRepayments.forEach(p=>a.push({id:p.id,date:p.date,title:`Udhar repayment — ${p.personName||'Customer'}`,type:'repayment',amount:p.amount,account:p.account,in:true}));state.ticketPayments.forEach(p=>a.push({id:p.id,date:p.date,title:'Ticket payment',type:'ticket',amount:p.amount,account:p.account,in:false}));state.expenses.forEach(p=>a.push({id:p.id,date:p.date,title:`Expense — ${p.description}`,type:'expense',amount:p.amount,account:p.account,in:false}));state.loans.forEach(p=>a.push({id:p.id,date:p.date,title:`Udhar given — ${p.personName}`,type:'loan',amount:p.amount,account:p.account,in:false}));return a}
function renderBank(){
 const tx=transactions().filter(t=>t.account==='bank').sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));let run=state.openingBank;const calc=tx.map(t=>{run+=t.in?t.amount:-t.amount;return {...t,balance:run}}).reverse();
 const rows=calc.map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(t.title)}</td><td><span class="pill">${t.type}</span></td><td class="num ${t.in?'green':'red'}">${t.in?'+':'−'}${money(t.amount)}</td><td class="num">${money(t.balance)}</td></tr>`);
 return pageHead('Bank & Transactions','One connected bank balance. Only actual bank money movements change it.','<button data-action="opening-balance" class="secondary">Set Opening Balance</button><button data-action="export-csv">Export CSV</button>')+
 `<div class="grid">${metric('Opening Balance',money(state.openingBank))}${metric('Current Bank Balance',money(bankBalance()),bankBalance()<0?'red':'green')}${metric('Bank Money In',money(sum(tx.filter(t=>t.in),t=>t.amount)),'green')}${metric('Bank Money Out',money(sum(tx.filter(t=>!t.in),t=>t.amount)),'red')}</div>`+
 panel('Bank Statement',table([{label:'Date'},{label:'Transaction'},{label:'Type'},{label:'Amount',right:true},{label:'Running Balance',right:true}],rows,'No bank transactions yet.'));
}
function renderReports(){
 const m=$('#workDate').value.slice(0,7),bs=state.bookings.filter(b=>month(b.date)===m),es=state.expenses.filter(e=>month(e.date)===m),cust=state.customerPayments.filter(p=>month(p.date)===m),tpay=state.ticketPayments.filter(p=>month(p.date)===m);
 return pageHead('Monthly Reports','Profit is service charges minus ordinary expenses. Ticket cost and lending are excluded.','<button class="secondary" onclick="window.print()">Print Report</button>')+
 `<div class="grid">${metric('Service Charge',money(sum(bs,b=>b.serviceCharge)),'green')}${metric('Other Expenses',money(sum(es,e=>e.amount)),'red')}${metric('Net Profit',money(profit(m)),profit(m)<0?'red':'green')}${metric('Bookings',bs.length)}</div>`+
 `<div class="cols">${panel('Profit Summary',`<div class="balance-line"><span>Ticket service charges</span><b class="green">${money(sum(bs,b=>b.serviceCharge))}</b></div><div class="balance-line"><span>Other expenses</span><b class="red">− ${money(sum(es,e=>e.amount))}</b></div><div class="balance-line"><b>Net profit</b><b>${money(profit(m))}</b></div>`)}${panel('Cash Movement (not profit)',`<div class="balance-line"><span>Customer payments received</span><b>${money(sum(cust,p=>p.amount))}</b></div><div class="balance-line"><span>Ticket payments</span><b>${money(sum(tpay,p=>p.amount))}</b></div><div class="balance-line"><span>Udhar lent</span><b>${money(sum(state.loans.filter(l=>month(l.date)===m),l=>l.amount))}</b></div><div class="balance-line"><span>Udhar repayments</span><b>${money(sum(state.loanRepayments.filter(p=>month(p.date)===m),p=>p.amount))}</b></div>`)}</div>`+
 panel(`Bookings for ${m}`,table([{label:'Date'},{label:'Customer'},{label:'Ticket Cost',right:true},{label:'Service Charge',right:true},{label:'Received',right:true}],bs.map(b=>`<tr><td>${esc(b.date)}</td><td>${esc(b.customerName)}</td><td class="num">${money(b.ticketCost)}</td><td class="num green">${money(b.serviceCharge)}</td><td class="num">${money(custPaid(b.id))}</td></tr>`)));
}
function renderRecords(){
 const rows=[...transactions()].sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(t.title)}</td><td>${t.account==='bank'?'Bank':'Cash'}</td><td class="num ${t.in?'green':'red'}">${t.in?'+':'−'}${money(t.amount)}</td><td>${rowActions(t.type,t.id)}</td></tr>`);
 return pageHead('All Records','Search and filter individual money movements.')+`<div class="panel"><div class="formgrid"><div class="field"><label>Search records</label><input id="recordSearch" placeholder="Search name, description or type"></div><div class="field"><label>From date</label><input id="recordFrom" type="date"></div><div class="field"><label>To date</label><input id="recordTo" type="date"></div></div></div>`+panel('Money Movement History',table([{label:'Date'},{label:'Details'},{label:'Account'},{label:'Amount',right:true},{label:'Actions'}],rows));
}
function renderCustomers(){
 const names=[...new Set([...state.bookings.map(b=>b.customerName),...state.legacyReceivables.map(r=>r.personName)].map(x=>String(x||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
 const rows=names.map(name=>{const bs=state.bookings.filter(b=>b.customerName.toLowerCase()===name.toLowerCase());const received=sum(bs,b=>custPaid(b.id));const outstanding=sum(bs,due);return `<tr><td><b>${esc(name)}</b></td><td class="num">${bs.length}</td><td class="num">${money(sum(bs,b=>b.serviceCharge))}</td><td class="num">${money(received)}</td><td class="num amber">${money(outstanding)}</td><td><button class="small secondary" data-customer="${esc(name)}">View History</button></td></tr>`});
 return pageHead('Customer Profiles','Customer-wise booking, payment and outstanding summary.')+panel('Customers',table([{label:'Customer'},{label:'Bookings',right:true},{label:'Service Charges',right:true},{label:'Received',right:true},{label:'Outstanding',right:true},{label:'History'}],rows,'Customer profiles will appear when you add bookings.'));
}
function renderBudget(){
 const target=Number(state.allocatedBudget)||0;const actual=sum(state.bookings.filter(b=>month(b.date)===$('#workDate').value.slice(0,7)),b=>b.serviceCharge);const pct=target>0?Math.min(100,actual/target*100):0;
 return pageHead('Budget Calculator','Set a monthly service-charge target and track progress.')+panel('Monthly Target',`<form id="budgetForm" class="toolbar"><div class="field" style="min-width:220px"><label>Monthly Profit Target (₹)</label><input name="budget" type="number" min="0" step="0.01" value="${target}" required></div><button>Save Target</button></form><div class="grid" style="margin-top:15px">${metric('Monthly Target',money(target))}${metric('Service Charges Earned',money(actual),'green')}${metric('Remaining',money(Math.max(0,target-actual)),'amber')}${metric('Progress',target?Math.round(pct)+'%':'—')}</div><div style="height:12px;background:#e2e8f0;border-radius:20px;overflow:hidden"><div style="height:100%;width:${pct}%;background:#2563eb"></div></div><p class="sub">Budget progress uses service charges before other expenses. Net profit is shown separately on Reports.</p>`);
}
function renderBackup(){
 return pageHead('Backup & Settings','Your records are saved in this browser. Export backups regularly.')+
 `<div class="notice">Offline mode is active. No Firebase account is required. This standalone file does not send your financial data to a server.</div>`+
 panel('Backup & Restore',`<div class="toolbar"><button data-action="backup">Download Full JSON Backup</button><label class="secondary" style="padding:9px 13px;border-radius:9px;cursor:pointer;font-weight:650">Restore JSON Backup <input id="restoreFile" type="file" accept="application/json,.json" hidden></label><button class="secondary" data-action="export-csv">Export Transactions CSV</button></div><p class="sub">A backup includes bookings, all payments, expenses, lending records and the original imported ledger snapshot (if any).</p>`) +
 panel('Opening Bank Balance',`<div class="balance-line"><span>Configured opening balance</span><b>${money(state.openingBank)}</b></div><p class="sub">Set or correct this from Bank & Transactions. Do not use it to record daily receipts or payments.</p>`) +
 panel('Data Safety',`<div class="notice warn">Reset permanently clears the new standalone ledger in this browser. Export a backup first. The original legacy storage key is retained during migration and is not automatically deleted.</div><button class="danger" data-action="reset">Reset Standalone Data</button>`);
}
function render(){navHtml();let html={dashboard:renderDashboard,bookings:renderBookings,expenses:renderExpenses,udhar:renderUdhar,bank:renderBank,reports:renderReports,records:renderRecords,customers:renderCustomers,budget:renderBudget,backup:renderBackup}[view]();$('#app').innerHTML=html;document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;render()}));const bf=$('#budgetForm');if(bf)bf.onsubmit=e=>{e.preventDefault();state.allocatedBudget=+new FormData(bf).get('budget')||0;persist('Budget target saved')};document.querySelectorAll('[data-customer]').forEach(b=>b.onclick=()=>{const n=b.dataset.customer;view='records';render();const q=$('#recordSearch');if(q){q.value=n;q.dispatchEvent(new Event('input',{bubbles:true}))}})}
function openModal(title,body,submitText='Save',onSave){modal={onSave};$('#modalHost').innerHTML=`<div class="modalback"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="ghost small" data-close>Close</button></div><form id="editForm">${body}<div class="actions" style="justify-content:flex-end;margin-top:16px"><button type="button" class="ghost" data-close>Cancel</button><button>${submitText}</button></div></form></div></div>`;$('#modalHost').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);$('#editForm').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));modal.onSave(data);closeModal()}}
function closeModal(){$('#modalHost').innerHTML='';modal=null}
function bookingForm(b={}){openModal(b.id?'Edit Booking':'New Ticket Booking',`<div class="formgrid">${field('Booking Date','date','date',b.date||$('#workDate').value)}${field('Customer Name','customerName','text',b.customerName||'')}${field('Journey / Route','journey','text',b.journey||'')}${field('Booking Reference','bookingRef','text',b.bookingRef||'')}${field('Ticket Cost (₹)','ticketCost','number',b.ticketCost??'')}${field('Service Charge / Profit (₹)','serviceCharge','number',b.serviceCharge??'')}${field('Notes','notes','textarea',b.notes||'', '',true)}</div><p class="sub">No payment is recorded here. Record customer receipts and ticket payments separately after saving.</p>`,b.id?'Update Booking':'Save Booking',d=>{const obj={...b,id:b.id||id('booking'),date:d.date,customerName:d.customerName.trim(),journey:d.journey,ticketCost:+d.ticketCost,serviceCharge:+d.serviceCharge,bookingRef:d.bookingRef,notes:d.notes};if(!obj.customerName||obj.ticketCost<0||obj.serviceCharge<0)return toast('Enter valid booking details');if(b.id)state.bookings=state.bookings.map(x=>x.id===b.id?obj:x);else state.bookings.push(obj);persist('Booking saved')})}
function paymentForm(b,kind){const isCustomer=kind==='customer';const title=isCustomer?'Receive Customer Payment':'Record Ticket Payment';openModal(title,`<div class="notice">${esc(b.customerName)} · ${esc(b.journey||'Ticket booking')}<br>Booking date ${esc(b.date)} · ${isCustomer?'Customer amount due: '+money(due(b)):'Ticket amount due: '+money(ticketDue(b))}</div><div class="formgrid">${field('Payment Date','date','date',$('#workDate').value)}${field('Amount (₹)','amount','number','')}${field('Received / Paid From','account','select','','<option value="bank">Bank</option><option value="cash">Cash</option>')}${field('Note','note','text','')}</div>`, 'Save Payment',d=>{const amount=+d.amount;if(!(amount>0))return toast('Enter a valid amount');if(isCustomer&&amount>due(b))return toast('Customer payment exceeds the outstanding amount');if(!isCustomer&&amount>ticketDue(b))return toast('Ticket payment exceeds the outstanding ticket cost');if(isCustomer){state.customerPayments.push({id:id('cp'),bookingId:b.id,date:d.date,customerName:b.customerName,amount,account:d.account,note:d.note});}else state.ticketPayments.push({id:id('tp'),bookingId:b.id,date:d.date,amount,account:d.account,note:d.note});persist(isCustomer?'Customer payment recorded':'Ticket payment recorded')})}
function expenseForm(e={}){openModal(e.id?'Edit Expense':'Add Other Expense',`<div class="formgrid">${field('Date','date','date',e.date||$('#workDate').value)}${field('Amount (₹)','amount','number',e.amount??'')}${field('Category','category','text',e.category||'General')}${field('Description / Paid To','description','text',e.description||'')}${field('Paid From','account','select',e.account||'bank',accountOpts(e.account||'bank'))}</div>`,e.id?'Update Expense':'Save Expense',d=>{if(!(+d.amount>0))return toast('Enter a valid amount');const x={id:e.id||id('expense'),date:d.date,amount:+d.amount,category:d.category,description:d.description,account:d.account};if(e.id)state.expenses=state.expenses.map(v=>v.id===e.id?x:v);else state.expenses.push(x);persist('Expense saved')})}
function loanForm(l={}){openModal(l.id?'Edit Udhar':'Give Udhar',`<div class="formgrid">${field('Date Lent','date','date',l.date||$('#workDate').value)}${field('Person Name','personName','text',l.personName||'')}${field('Amount Lent (₹)','amount','number',l.amount??'')}${field('Paid From','account','select',l.account||'bank',accountOpts(l.account||'bank'))}${field('Due Date','dueDate','date',l.dueDate||'')}${field('Note','note','text',l.note||'')}</div><p class="sub">Lending reduces your bank/cash balance but is not an expense and does not reduce profit.</p>`,l.id?'Update Udhar':'Save Lending',d=>{if(!(+d.amount>0)||!d.personName.trim())return toast('Enter person and valid amount');const x={id:l.id||id('loan'),date:d.date,personName:d.personName,amount:+d.amount,account:d.account,dueDate:d.dueDate,note:d.note};if(l.id)state.loans=state.loans.map(v=>v.id===l.id?x:v);else state.loans.push(x);persist('Udhar lending saved')})}
function repayForm(l){openModal('Record Udhar Repayment',`<div class="notice">${esc(l.personName)} · Outstanding ${money(loanDue(l))}</div><div class="formgrid">${field('Repayment Date','date','date',$('#workDate').value)}${field('Amount Received (₹)','amount','number','')}${field('Received In','account','select','','<option value="bank">Bank</option><option value="cash">Cash</option>')}${field('Note','note','text','')}</div><p class="sub">Repayment increases your bank/cash balance but is not income or profit.</p>`,'Record Repayment',d=>{if(!(+d.amount>0))return toast('Enter valid amount');if(+d.amount>loanDue(l))return toast('Repayment exceeds outstanding amount');state.loanRepayments.push({id:id('repay'),loanId:l.id,date:d.date,amount:+d.amount,account:d.account,personName:l.personName,note:d.note});persist('Repayment recorded')})}
function openingForm(){openModal('Set Opening Bank Balance',`<div class="field"><label>Opening Balance (₹)</label><input name="openingBank" type="number" step=".01" value="${state.openingBank}" required></div><p class="sub">This is the starting balance before transactions in this standalone ledger. Changing it recalculates the current bank balance.</p>`,'Save Balance',d=>{state.openingBank=+d.openingBank||0;persist('Opening balance updated')})}
function persist(msg){save();render();if(msg)toast(msg)}
function deleteRecord(type,rid){if(!confirm('Delete this record? Related payment history may remain for audit.'))return;const map={booking:['bookings'],expense:['expenses'],loan:['loans'],customer:['customerPayments'],ticket:['ticketPayments'],repayment:['loanRepayments']};const key=map[type]?.[0];if(!key)return;state[key]=state[key].filter(x=>x.id!==rid);persist('Record deleted')}
function editRecord(type,rid){const maps={booking:['bookings',bookingForm],expense:['expenses',expenseForm],loan:['loans',loanForm]};const m=maps[type];if(m){const x=state[m[0]].find(v=>v.id===rid);if(x)m[1](x);return}const cfg={customer:['customerPayments','Customer Receipt'],ticket:['ticketPayments','Ticket Payment'],repayment:['loanRepayments','Udhar Repayment']}[type];if(cfg){const x=state[cfg[0]].find(v=>v.id===rid);if(!x)return;openModal('Edit '+cfg[1],`<div class="formgrid">${field('Date','date','date',x.date)}${field('Amount (₹)','amount','number',x.amount)}${field('Account','account','select',x.account,accountOpts(x.account))}${field('Note','note','text',x.note||'')}</div>`,'Update Record',d=>{if(!(+d.amount>0))return toast('Enter a valid amount');Object.assign(x,{date:d.date,amount:+d.amount,account:d.account,note:d.note});persist('Payment updated')})}}
function exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});download(blob,'Expense_Tracker_Backup_'+today()+'.json')}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportCSV(){const rows=[['Date','Type','Details','Account','Money In','Money Out'],...transactions().map(t=>[t.date,t.type,t.title,t.account,t.in?t.amount:'',!t.in?t.amount:''])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),'Expense_Transactions_'+today()+'.csv')}
function handleAction(a,idv){switch(a){case'new-booking':bookingForm();break;case'new-expense':expenseForm();break;case'new-loan':loanForm();break;case'customer-payment':case'ticket-payment':{const b=state.bookings.find(x=>x.id===idv);if(b)paymentForm(b,a==='customer-payment'?'customer':'ticket');break}case'loan-repay':{const l=state.loans.find(x=>x.id===idv);if(l)repayForm(l);break}case'opening-balance':openingForm();break;case'backup':exportBackup();break;case'export-csv':exportCSV();break;case'reset':if(confirm('This clears the standalone ledger only. Export backup first. Continue?')){state=empty();save();render();toast('Standalone ledger reset')}break}}
document.addEventListener('click',e=>{const v=e.target.closest('[data-view]');if(v){view=v.dataset.view;render();return}const a=e.target.closest('[data-action]');if(a){handleAction(a.dataset.action,a.dataset.id);return}const ed=e.target.closest('[data-edit]');if(ed){editRecord(ed.dataset.edit,ed.dataset.id);return}const del=e.target.closest('[data-delete]');if(del){deleteRecord(del.dataset.delete,del.dataset.id)}});
$('#workDate').value=today();$('#workDate').addEventListener('change',render);
function filterRecords(){const q=($('#recordSearch')?.value||'').toLowerCase(),from=$('#recordFrom')?.value||'',to=$('#recordTo')?.value||'';document.querySelectorAll('#app tbody tr').forEach(r=>{const d=r.cells[0]?.innerText||'',okSearch=!q||r.innerText.toLowerCase().includes(q),okFrom=!from||d>=from,okTo=!to||d<=to;r.classList.toggle('hidden',!(okSearch&&okFrom&&okTo))})}
$('#app').addEventListener('input',e=>{if(['recordSearch','recordFrom','recordTo'].includes(e.target.id))filterRecords()});$('#app').addEventListener('change',e=>{if(['recordFrom','recordTo'].includes(e.target.id))filterRecords()}); 
document.addEventListener('change',e=>{if(e.target.id==='restoreFile'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!confirm('Restore replaces current standalone records. Continue?'))return;state=normalize(x);save();render();toast('Backup restored')}catch{toast('Invalid backup file')}};r.readAsText(f)}});
state=load();render();
})();
</script></body></html>
